name: CI

env:
  # detect_container_overflow is off: CPython, protobuf and googletest are built
  # without instrumentation, so their containers lack the annotations ASan expects
  # and the check reports false positives.
  ASAN_OPTIONS: detect_leaks=0:symbolize=1:detect_stack_use_after_return=true:strict_init_order=true:detect_odr_violation=1:detect_container_overflow=0:check_initialization_order=true:debug=true:fast_unwind_on_malloc=1:verify_asan_link_order=0:alloc_dealloc_mismatch=1:abort_on_error=1
  UBSAN_OPTIONS: print_stacktrace=1
  TSAN_OPTIONS: suppressions=./tsan.supp

on:
  schedule:
    - cron: '0 0 * * *'  # every day at midnight for reporting code coverage to codecov
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:  # set top-level default permissions as security good practice
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.os }}, ${{ matrix.python_version }}, ${{ matrix.protobuf_type }}, debug=${{ matrix.debug_build }}, unity_build=${{ matrix.unity_build }}, onnx_ml=${{ matrix.onnx_ml }}, autogen=${{ matrix.autogenerate_files }}${{ matrix.job_name_suffix }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        # Retain the legacy values only to preserve required status-check names.
        autogenerate_files: [0]
        # Test on the oldest and latest supported Python versions
        debug_build: [0]
        onnx_ml: [1]
        protobuf_type: ['Internal']
        python_version: ['3.15t', '3.15', '3.14t', '3.14', '3.11']
        unity_build: [0]

        include:
          # Exercise what a fresh `pip install onnx` produces - gencode from the
          # pinned protoc plus the newest protobuf runtime - without adding
          # another Linux job. The remaining matrix entries keep testing the
          # runtime pinned in requirements-release_test.txt.
          - python_version: "3.14"
            os: "ubuntu-24.04"
            newest_protobuf: 1
            job_name_suffix: ", newest_protobuf=1"

          # Exercise clang-cl without adding another Windows job. The remaining
          # Windows matrix entries continue to provide MSVC coverage.
          - python_version: "3.14"
            os: "windows-latest"
            cmake_generator_args: "-T ClangCL"
            job_name_suffix: ", compiler=clang-cl"

          # Ubuntu debug build runs with sanitizer
          - python_version: "3.14"
            autogenerate_files: 0
            debug_build: 1
            onnx_ml: 1
            os: "ubuntu-24.04"
            protobuf_type: 'Internal'
            unity_build: 0

          # Ubuntu debug build with TSAN (free-threaded Python)
          - python_version: "3.14t"
            autogenerate_files: 0
            debug_build: 1
            onnx_ml: 1
            os: "ubuntu-24.04"
            protobuf_type: 'Internal'
            unity_build: 0

          # Test compilation with external protobuf (shared on Linux, static on Windows).
          - python_version: "3.14"
            autogenerate_files: 0
            debug_build: 0
            onnx_ml: 1
            os: "ubuntu-24.04"
            protobuf_type: 'External'
            unity_build: 0
          - python_version: "3.14"
            autogenerate_files: 0
            debug_build: 0
            onnx_ml: 1
            os: "windows-2022"
            protobuf_type: 'External'
            unity_build: 0
          # The unity build may surface name clashes at compile time.
          - python_version: '3.14'
            autogenerate_files: 1
            debug_build: 0
            onnx_ml: 1
            os: "ubuntu-24.04"
            protobuf_type: 'External'
            unity_build: 1

          # Toggling onnx_ml should be additive. There is likely very
          # different signal in testing it in relation with other
          # parameters.
          - python_version: '3.14'
            autogenerate_files: 0
            debug_build: 0
            onnx_ml: 0
            os: "ubuntu-24.04"
            protobuf_type: 'External'
            unity_build: 0

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python_version }}
          # Python 3.15 is still a release candidate.
          allow-prereleases: true

      - name: Show versions
        run: |
          python --version
          cmake --version

      - name: Install external protobuf - Linux
        if: matrix.protobuf_type == 'External' && startsWith(matrix.os,'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install libprotobuf-dev protobuf-compiler

      - name: Set up MSBuild (x64)
        if: startsWith(matrix.os,'windows')
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
        with:
          msbuild-architecture: x64

      # Cache only the installed external Protobuf artifacts (not the build/source tree).
      # Version bumps in sbom.cdx.json invalidate the cache key automatically.
      - name: Restore cached external protobuf - Windows
        if: matrix.protobuf_type == 'External' && startsWith(matrix.os, 'windows')
        id: protobuf-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/protobuf-build/install
          key: external-protobuf-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('sbom.cdx.json', 'CMakeLists.txt', 'cmake/Utils.cmake', 'workflow_scripts/protobuf/build.py') }}

      - name: Install external protobuf - Windows
        if: matrix.protobuf_type == 'External' && startsWith(matrix.os, 'windows') && steps.protobuf-cache.outputs.cache-hit != 'true'
        run: |
          python workflow_scripts/protobuf/build.py --build-dir "${{ runner.temp }}/protobuf-build"
        shell: pwsh

      # On a cache miss, build.py exports these paths; on a cache hit, export them here.
      - name: Export external protobuf paths - Windows
        if: matrix.protobuf_type == 'External' && startsWith(matrix.os, 'windows') && steps.protobuf-cache.outputs.cache-hit == 'true'
        run: |
          $prefix = "${{ runner.temp }}\protobuf-build\install"
          if ($env:CMAKE_PREFIX_PATH) {
            "CMAKE_PREFIX_PATH=$prefix;$($env:CMAKE_PREFIX_PATH)" >> $env:GITHUB_ENV
          }
          else {
            "CMAKE_PREFIX_PATH=$prefix" >> $env:GITHUB_ENV
          }
          "$prefix\bin" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Build and install ONNX - Linux
        if: startsWith(matrix.os,'ubuntu')
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          if [ "${{ matrix.python_version }}" == "3.14" ]; then
            sudo apt-get update
            sudo apt-get install libjpeg-dev zlib1g-dev libpng-dev
          fi

          if [ "${{ matrix.protobuf_type }}" == "External" ]; then
            export CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DONNX_USE_PROTOBUF_SHARED_LIBS=ON"
          fi
          if [ "${{ matrix.debug_build }}" == "1" ]; then
            if [ "${{ matrix.python_version }}" == "3.14t" ]; then
              export CMAKE_ARGS="$CMAKE_ARGS -DONNX_USE_ASAN=OFF -DONNX_USE_TSAN=ON"
            else
              export CMAKE_ARGS="$CMAKE_ARGS -DONNX_USE_ASAN=ON"
            fi
          fi
          pip install -e ".[reference]" -v
        env:
          DEBUG: ${{ matrix.debug_build }}
          ONNX_ML: ${{ matrix.onnx_ml }}
          ONNX_BUILD_TESTS: 1
          CMAKE_ARGS: "-DONNX_WERROR=ON -DONNX_USE_ASAN=${{ matrix.debug_build }} -DONNX_USE_UNITY_BUILD=${{ matrix.unity_build }} -DONNX_HARDENING=ON"

      - name: Build and install ONNX - MacOS
        if: matrix.os == 'macos-latest'
        run: |
          pip install -e ".[reference]" -v
        env:
          DEBUG: ${{ matrix.debug_build }}
          ONNX_ML: ${{ matrix.onnx_ml }}
          ONNX_BUILD_TESTS: 1
          CMAKE_ARGS: "-DONNX_WERROR=ON -DONNX_USE_UNITY_BUILD=${{ matrix.unity_build }} -DONNX_HARDENING=ON"

      - name: Build and install ONNX - Windows
        if: startsWith(matrix.os,'windows')
        run: |
          pip install -e . -v
          if ("${{ matrix.protobuf_type }}" -eq "External") {
            $cache = Get-Content .setuptools-cmake-build/CMakeCache.txt
            $protocEntry = $cache | Where-Object { $_ -like 'Protobuf_PROTOC_EXECUTABLE:FILEPATH=*' } | Select-Object -First 1
            if ($null -eq $protocEntry) {
              throw "Protobuf_PROTOC_EXECUTABLE not found in .setuptools-cmake-build/CMakeCache.txt"
            }
            # Normalize both paths before comparing.
            $protoc = [IO.Path]::GetFullPath($protocEntry.Substring('Protobuf_PROTOC_EXECUTABLE:FILEPATH='.Length))
            # Resolve from the install dir directly in case CMAKE_PREFIX_PATH has multiple entries.
            $expectedProtoc = [IO.Path]::GetFullPath("${{ runner.temp }}/protobuf-build/install/bin/protoc.exe")
            if ($protoc -ne $expectedProtoc) {
              throw "ONNX used Protobuf at '$protoc' instead of the installed external one at '$expectedProtoc'"
            }
            # Fail if CMake fell back to FetchContent instead of using the external install.
            if (Test-Path .setuptools-cmake-build/_deps/protobuf-src) {
              throw "ONNX fell back to building Protobuf from source instead of using the installed external one"
            }
          }
        env:
          DEBUG: ${{ matrix.debug_build }}
          ONNX_ML: ${{ matrix.onnx_ml }}
          ONNX_BUILD_TESTS: 1
          CMAKE_ARGS: "${{ matrix.cmake_generator_args }} -DONNX_WERROR=ON -DONNX_USE_PROTOBUF_SHARED_LIBS=OFF -DONNX_USE_LITE_PROTO=ON -DONNX_USE_UNITY_BUILD=${{ matrix.unity_build }} -DONNX_HARDENING=ON"

      - name: pip freeze
        run: |
          pip freeze

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-release_test.txt

      - name: Upgrade the protobuf runtime to the newest release
        if: matrix.newest_protobuf == 1
        run: |
          python -m pip install --upgrade protobuf
          python -c "import google.protobuf; print(google.protobuf.__version__)"

      - name: Setup ASAN LD_PRELOAD
        if: startsWith(matrix.os,'ubuntu') && (matrix.debug_build == 1) && (matrix.python_version != '3.14t') && (matrix.python_version != '3.11')
        run: |
          echo "LD_PRELOAD=$(/usr/bin/c++ -print-file-name=libasan.so):$(/usr/bin/c++ -print-file-name=libstdc++.so)" >> $GITHUB_ENV

      - name: Setup TSAN LD_PRELOAD
        if: startsWith(matrix.os,'ubuntu') && (matrix.debug_build == 1) && (matrix.python_version == '3.14t')
        run: |
          echo "LD_PRELOAD=$(/usr/bin/c++ -print-file-name=libtsan.so):$(/usr/bin/c++ -print-file-name=libstdc++.so)" >> $GITHUB_ENV

      - name: Run Python tests
        # Prohibitively slow for Windows debug builds
        if: ${{ !(startsWith(matrix.os, 'windows') && matrix.debug_build == 1) }}
        run: |
          pytest -sv --cov=onnx --cov-report=xml --cov-append --cov-branch --junitxml junit.xml -n auto --dist loadscope
      - name: Run C++ tests
        if: startsWith(matrix.os,'ubuntu') || matrix.os == 'macos-latest'
        run: |
          export LD_LIBRARY_PATH="./.setuptools-cmake-build/:$LD_LIBRARY_PATH"
          ./.setuptools-cmake-build/onnx_gtests

      - name: Check that the generated protobuf objects are not duplicated
        # The generated *.pb.cc objects must live in onnx_proto only. A second
        # copy inside onnx makes any process that loads both libraries register
        # onnx/onnx-ml.proto twice, which aborts protobuf with
        # "File already exists in database" (issue #6094).
        if: startsWith(matrix.os,'ubuntu') || matrix.os == 'macos-latest'
        run: |
          ar t .setuptools-cmake-build/libonnx.a > onnx_members.txt
          if grep '\.pb\.cc\.o$' onnx_members.txt; then
            echo "::error::libonnx contains a second copy of the generated protobuf objects; it must link onnx_proto instead"
            exit 1
          fi

      - name: Run C++ extension test
        if: startsWith(matrix.os,'ubuntu') && matrix.debug_build == 0 && matrix.protobuf_type == 'External'
        run: |
          cmake -S . -B build_for_install \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DONNX_ML=${{ matrix.onnx_ml }} \
            -DONNX_USE_PROTOBUF_SHARED_LIBS=ON
          cmake --build build_for_install --parallel
          sudo cmake --install build_for_install

          cmake -S tests/cmake -B tests/cmake/build \
            -DONNX_ML=${{ matrix.onnx_ml }}
          cmake --build tests/cmake/build
          ./tests/cmake/build/main

      - name: Upload coverage to Codecov
        if: github.repository_owner == 'onnx'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: github.repository_owner == 'onnx' && !cancelled()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

      - name: Run Python tests with numpy<2.0 (win, mac)
        if: (matrix.python_version == '3.11') && (matrix.os == 'windows-latest' || matrix.os == 'macos-latest') && (matrix.debug_build != 1)
        run: |
          # ml_dtypes 0.6.0 dropped numpy 1 support, so pin the last version that supports it.
          pip install "numpy<2.0" "ml_dtypes==0.5.4" pillow
          pytest -s

      - name: Run Python tests with numpy<2.0 (ubuntu, python<3.13)
        if: (matrix.python_version == '3.11') && startsWith(matrix.os,'ubuntu')
        run: |
          # 2024.10.15: Error message: The headers or library files could not be found for jpeg, a required dependency when compiling Pillow from source.
          sudo apt-get update
          sudo apt-get install libjpeg-dev zlib1g-dev libpng-dev
          # ml_dtypes 0.6.0 dropped numpy 1 support, so pin the last version that supports it.
          pip install --prefer-binary "numpy<2.0" "ml_dtypes==0.5.4" pillow
          pytest -s
