name: Semgrep

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: All public community rules (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out public community rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: semgrep/semgrep-rules
          ref: 16b9e6d45f10649f6a531ec4838ed9924372c3bc
          path: .semgrep-rules
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install scanner
        run: python -m pip install -r requirements-semgrep.txt
      - name: Collect all public rules
        run: python workflow_scripts/semgrep/collect_rules.py .semgrep-rules "$RUNNER_TEMP/semgrep-rules.json"
      - name: Scan
        # Findings are advisory while false positives are evaluated. Scanner
        # failures still fail the job; deliberately do not use --error.
        run: |
          semgrep scan --config "$RUNNER_TEMP/semgrep-rules.json" \
            --metrics=off --disable-version-check --disable-nosem \
            --json-output "$RUNNER_TEMP/semgrep-results.json" \
            --sarif-output "$RUNNER_TEMP/semgrep-results.sarif" \
            --text-output "$RUNNER_TEMP/semgrep-results.txt" .
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-results
          path: ${{ runner.temp }}/semgrep-results.*
          if-no-files-found: error
          retention-days: 14
