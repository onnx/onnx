name: Scientific Python Nightly
on:
  schedule:
    # Run weekly on Monday 00:00 UTC
    - cron:  '00 00 * * MON'

  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      publish_scientific_nightly: # Publish to scientific-python nightly channel
        description: 'Publish to scientific-python nightly channel'
        required: true
        type: choice
        options:
          - 'yes'
          - 'no'
        default: 'no'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

jobs:

  call-linux:
    uses: $/.github/workflows/release_linux_cibw.yml
    with:
      build_mode: 'scientific'

  call-win:
    uses: $/.github/workflows/release_windows_cibw.yml
    with:
      build_mode: 'scientific'

  call-mac:
    uses: $/.github/workflows/release_macos_cibw.yml
    with:
      build_mode: 'scientific'

  call-sdist:
    uses: $/.github/workflows/release_sdist.yml
    with:
      build_mode: 'scientific'

  publish_scientific_nightly:
    name: Publish to scientific-python nightly channel
    runs-on: ubuntu-latest
    needs: [call-linux, call-mac, call-win, call-sdist]
    if: (!contains(join(needs.*.result, ' '), 'skipped')) && (github.event_name == 'schedule' || github.event.inputs.publish_scientific_nightly == 'yes') && (github.repository_owner == 'onnx') && (github.ref == 'refs/heads/main')

    permissions:
      contents: read

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v7.0.2
        with:
          pattern: wheels*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v7.0.2
        with:
          pattern: sdist
          path: dist
          merge-multiple: true

      - name: Upload to scientific-python nightly channel
        uses: scientific-python/upload-nightly-action@5748273c71e2d8d3a61f3a11a16421c8954f9ecf # 0.6.3
        with:
          artifacts_path: dist
          anaconda_nightly_upload_token: ${{ secrets.SCIENTIFIC_PYTHON_NIGHTLY_UPLOAD_TOKEN }}
