# Verifies that two independent builds from identical source produce bit-for-bit
# identical wheels (reproducible builds). Each platform cibw workflow is called
# twice, one call after the other, so the two builds run on separate runners at
# different times, and a compare job checks the wheels. A mismatch on any platform
# fails the workflow. Pull requests build one wheel per platform; the weekly and
# manual runs build the full release matrix.

name: ReproducibleBuild

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday 06:00 UTC
  workflow_dispatch:
  pull_request:
    # Source changes are covered by the weekly run; PRs only run when the build
    # configuration changes.
    paths:
      - "**/CMakeLists.txt"
      - "cmake/**"
      - "pyproject.toml"
      - "sbom.cdx.json"
      - ".github/actions/verify-sha256/**"
      - ".github/workflows/reproducible_build.yml"
      - ".github/workflows/release_linux_cibw.yml"
      - ".github/workflows/release_macos_cibw.yml"
      - ".github/workflows/release_windows_cibw.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    strategy:
      # One build after the other, so that timestamps which change between them show up.
      max-parallel: 1
      matrix:
        prefix: [repro-build1, repro-build2]
    uses: $/.github/workflows/release_linux_cibw.yml
    with:
      build_mode: release
      builds: ${{ github.event_name == 'pull_request' && '["cp312-manylinux_x86_64"]' || '' }}
      artifact_name_prefix: ${{ matrix.prefix }}
      skip_tests: true
      retention_days: 1

  macos:
    strategy:
      max-parallel: 1
      matrix:
        prefix: [repro-build1, repro-build2]
    uses: $/.github/workflows/release_macos_cibw.yml
    with:
      build_mode: release
      builds: ${{ github.event_name == 'pull_request' && '["cp312-macosx_universal2"]' || '' }}
      artifact_name_prefix: ${{ matrix.prefix }}
      skip_tests: true
      retention_days: 1

  windows:
    strategy:
      max-parallel: 1
      matrix:
        prefix: [repro-build1, repro-build2]
    uses: $/.github/workflows/release_windows_cibw.yml
    with:
      build_mode: release
      builds: ${{ github.event_name == 'pull_request' && '["cp312-win_amd64"]' || '' }}
      artifact_name_prefix: ${{ matrix.prefix }}
      skip_tests: true
      retention_days: 1

  compare:
    # Compare every platform whose builds finished, even if another platform failed.
    if: ${{ !cancelled() }}
    needs: [linux, macos, windows]
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: repro-build1-${{ matrix.platform }}-*
          path: build1
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: repro-build2-${{ matrix.platform }}-*
          path: build2
          merge-multiple: true

      - name: Compare wheel checksums
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          shopt -s nullglob
          build1=(build1/*.whl)
          build2=(build2/*.whl)
          if [ ${#build1[@]} -eq 0 ] || [ ${#build1[@]} -ne ${#build2[@]} ]; then
            echo "Expected the same wheels from both builds, got ${#build1[@]} and ${#build2[@]}"
            exit 1
          fi
          status=0
          for wheel in "${build1[@]}"; do
            name=$(basename "$wheel")
            if [ ! -f "build2/$name" ]; then
              echo "$name is missing from the second build"
              status=1
              continue
            fi
            sha256sum "$wheel" "build2/$name"
            if ! cmp --silent "$wheel" "build2/$name"; then
              echo "$name is not reproducible"
              status=1
            fi
          done
          if [ $status -ne 0 ]; then
            echo "$PLATFORM wheels differ. First compare the build environments listed on the run summary page:"
            echo "if they differ, a runner image update can explain the mismatch. Otherwise see"
            echo "docs/CIPipelines.md for diagnosing with diffoscope."
          fi
          exit $status
