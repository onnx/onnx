name: Test with numpy nightly wheels

on:
  schedule:
    - cron:  '0 0 * * 3'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  test_numpy_nightly:

    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
        python-version: ['3.11', '3.12', '3.13']
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:

        - name: Checkout repository
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            persist-credentials: false

        - name: Set up Python ${{ matrix.python-version }}
          uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
          with:
            python-version: ${{ matrix.python-version }}

        - name: Build and install source distribution from this checkout
          shell: bash
          run: |
            python -m pip install --upgrade pip
            python -m pip install build
            python -m build --sdist
            python -m pip install dist/*.tar.gz
            python -m pip install pytest ml_dtypes pillow

        - name: Install numpy nightly wheel
          shell: bash
          run: |
            python -m pip uninstall -y numpy
            python -m pip install -i https://pypi.anaconda.org/scientific-python-nightly-wheels/simple numpy

        - name: Run tests against numpy nightly
          run: pytest
